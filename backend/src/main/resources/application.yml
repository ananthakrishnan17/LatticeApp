spring:
  application:
    name: nammanban-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://18.60.200.156:5432/pgsql}
    username: ${DB_USERNAME:pgsql}
    password: ${DB_PASSWORD:tofze1-gEjmaf-mugdes}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NammaNanbanHikariPool
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 300000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    out-of-order: true
    default-schema: app_core
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  jwt:
    issuer: nammanban-pos
    secret: NammaNanbanPOS@2024#SecretKey!XYZ$
    access-token-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui